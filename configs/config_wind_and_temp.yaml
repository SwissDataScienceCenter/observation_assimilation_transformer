defaults:
  - dataset: cosmo_peakweather
  - split: default
  - dataloader: default
  - model: oat
  - trainer: default
  - predictor: oat_predictor
  - logging: default

# Individual manual overrides

dataset:
  nwp_vars:
  - T_2M         # 2m temperature
  - U_10M        # 10m U-wind component
  - V_10M        # 10m V-wind component

  obs_vars:
  - temperature
  - wind_gust
  - wind_u
  - wind_v

seed: 42

hydra:
  run:
    dir: outputs/${hydra:runtime.choices.model}/${now:%Y-%m-%d}/${now:%H-%M-%S}

paths:
  run_root: ${hydra:run.dir}