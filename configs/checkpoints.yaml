  deep_gp_precip: /scratch/mch/cdonner/observation_assimilation_transformer/checkpoints/deep_gp_oat_field/deep_gp_oat_field_cosmo_peakweather-precip_20260821_job5160670/best-model-epoch=22-val_crps_precipitation=0.0857.ckpt

