# Registry of evaluation checkpoints.
# Structure: {dataset_name: {model_name: checkpoint_path}}
# Use ~ (null) as a placeholder for checkpoints not yet available.
#
# Usage in scripts:
#   python -m scripts.evaluate_test_set --dataset cosmo_peakweather --model oat_wind
#   python -m scripts.plot_oat_example   --dataset cosmo_peakweather --model oat_wind
#
# ``interpolator`` is weightless (no learnt params, no checkpoint); the sentinel
# value ``interpolator`` maps to the interpolator_<dataset> result files.

cosmo_peakweather:
