# Registry of evaluation checkpoints.
# Structure: {dataset_name: {model_name: checkpoint_path}}
# Use ~ (null) as a placeholder for checkpoints not yet available.
# Paths are relative to the checkpoint root: $OAT_CKPT_ROOT, else <repo>/checkpoints.
# A new training run needs only a new relative line here.
#
# Usage in scripts:
#   python -m scripts.evaluate_test_set --dataset cosmo_peakweather --model oat_wind
#   python -m scripts.plot_oat_example   --dataset cosmo_peakweather --model oat_wind
#
# ``interpolator`` is weightless (no learnt params, no checkpoint); the sentinel
# value ``interpolator`` maps to the interpolator_<dataset> result files.

cosmo_peakweather:
  interpolator: interpolator
  oat_temp_precip: oat/oat_field_cosmo_peakweather-temp_precip_bn_20261006/best-model-epoch=105-val_loss=0.1946.ckpt
  oat_vanilla_temp_precip: oat/oat_field_cosmo_peakweather-temp_precip_20261007_job168391/best-model-epoch=124-val_loss=0.1944.ckpt
  oat_tetnp_temp_precip: oat/oat_field_cosmo_peakweather-temp_precip_20261007_job168392/best-model-epoch=134-val_loss=0.1916.ckpt
  uninformed_temp_precip: uninformed_oat/uninformed_oat_field_cosmo_peakweather-temp_precip_20260821_job5160674/best-model-epoch=81-val_loss=0.2279.ckpt
  ootg_temp_precip: ootg/ootg_cosmo_peakweather-temp_precip_ootg_20260909_job114747/epoch=47-val_loss=0.1213.ckpt
  gp_oat_temp: gp_oat/gp_oat_field_cosmo_peakweather-temp_20260821_job5160231/best-model-epoch=86-val_crps_temperature=0.9044.ckpt
  gp_oat_precip: gp_oat/gp_oat_field_cosmo_peakweather-precip_20260821_job5160230/best-model-epoch=20-val_crps_precipitation=0.0975.ckpt
  deep_gp_oat_temp: deep_gp_oat/deep_gp_oat_field_cosmo_peakweather-temp_20260821_job5160669/best-model-epoch=84-val_crps_temperature=0.8519.ckpt
  deep_gp_oat_precip: deep_gp_oat/deep_gp_oat_field_cosmo_peakweather-precip_20260821_job5160670/best-model-epoch=22-val_crps_precipitation=0.0857.ckpt

