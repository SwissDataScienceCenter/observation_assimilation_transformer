  oat_tetnp_temp_precip: ~
  uninformed_temp_precip: /scratch/mch/cdonner/observation_assimilation_transformer/checkpoints/uninformed_oat_field/uninformed_oat_field_cosmo_peakweather-temp_precip_20260821_job5160674/best-model-epoch=81-val_loss=0.2279.ckpt
  ootg_temp_precip: ~
