defaults:
  - settings@_here_
  - catalog@catalog
  - _self_

dataset_type: field_era5_meteostat

coord_sources:
  stations: {from: obs}
  nwp_grid: {from: nwp}

fields:
  obs:  {coords: stations, inputs: [obs.temp]}
  nwp:  {coords: stations, inputs: [nwp.2t], query: true}
  topo: {coords: stations, inputs: [topo.elevation, topo.distance_to_coast], query: true}
  geo:  {coords: stations, inputs: [coords.x, coords.y, topo.elevation],
         out: [longitude, latitude, elevation], query: true}

roles:
  target: obs
  global: nwp
  geo_bias: geo
  topo: topo

transform_type: real
