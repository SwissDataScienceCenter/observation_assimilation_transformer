defaults:
  - era5_meteostat/settings@_here_
  - _self_

nwp_vars: [tp, tcc]

obs_vars: [prcp]

obs_variable_to_distribution:
  prcp: zero_inflated_lognormal

fields:
  obs: {coords: stations, inputs: [obs.prcp]}
  nwp: {coords: stations, inputs: [nwp.tp, nwp.tcc], query: true, interp: linear}
  nwp_grid_field: {coords: nwp_grid, inputs: [nwp.tp, nwp.tcc]}