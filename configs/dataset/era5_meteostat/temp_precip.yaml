defaults:
  - era5_meteostat/settings@_here_
  - _self_

nwp_vars: [2t, tp, tcc]

obs_vars: [temp, prcp]

obs_variable_to_distribution:
  temp: normal
  prcp: zero_inflated_lognormal

fields:
  obs: {coords: stations, inputs: [obs.temp, obs.prcp]}
  nwp: {coords: stations, inputs: [nwp.2t, nwp.tp, nwp.tcc], query: true, k: 4}