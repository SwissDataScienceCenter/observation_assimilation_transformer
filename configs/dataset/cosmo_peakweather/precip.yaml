defaults:
  - cosmo_peakweather/settings@_here_
  - _self_

nwp_vars: [TOT_PREC_1H, CLCT]

obs_vars: [precipitation]

obs_variable_to_distribution:
  precipitation: zero_inflated_lognormal

# All stations incl. rain gauges (matches old temp_precip.yaml; overrides
# settings' meteo_station default). Rain gauges are the primary precip source.
station_type: null

fields:
  obs: {coords: stations, inputs: [obs.precipitation]}
  # Topo vars are appended to the global (nwp) field so topography enters the
  # global encoder too, mirroring the old grid path's global_field = NWP + topo
  # (topo still also feeds the separate topographic encoder).
  nwp:
    coords: stations
    inputs: [nwp.TOT_PREC_1H, nwp.CLCT]
    query: true
    k: 4