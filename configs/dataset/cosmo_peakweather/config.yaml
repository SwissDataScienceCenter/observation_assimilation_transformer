# CosmoPeakWeather Dataset Configuration

# Data paths
nwp_path: "/scratch/mch/fzanetta/data/anemoi/datasets/mch-co1e-an-archive-0p01-2019-2024-1h-v1-pl13.zarr"
topo_path: "/scratch/mch/cdonner/data/obs_downscaling/raw/cosmo-1e_rechunked/topo.zarr"
obs_path: "/scratch/mch/cdonner/data/peakweather"
ref_nwp_path: "/scratch/mch/cdonner/data/obs_downscaling/raw/cosmo-1e_rechunked/nwp.zarr"
nwp_extracted_path: "/scratch/mch/cdonner/data/obs_downscaling/raw/cosmo-1e_rechunked/nwp_extracted.zarr"

# Variable catalog — metadata (description, unit, support, default distributions)
variable_catalog_path: "configs/dataset/cosmo_peakweather/var_catalogue.yaml"

# NWP variables (COSMO)
nwp_vars:
  - T_2M
  - T_G

# Topographic variables
topo_vars:
  - DEM
  - TPI_500M
  - TPI_2000M
  - WE_DERIVATIVE_2000M_SIGRATIO1
  - SN_DERIVATIVE_2000M_SIGRATIO1

# Observation variables (PeakWeather) — targets for downscaling
obs_vars:
  - temperature

# Output distributions for obs_vars (used by the output head via ${dataset.obs_variable_to_distribution})
# Must list every variable in obs_vars.
obs_variable_to_distribution:
  temperature: "normal"

# Per-variable settings. Supported keys:
#   use_log: true  — apply log pre-transform before stats/normalization.
#                    Only valid for variables with "positive" support in the catalog.
#                    Changes effective support to "real"; distribution must also have "real" support.
#
# Example — model precipitation in log space with a normal output distribution:
#
#   obs_vars:
#     - precipitation
#   obs_variable_to_distribution:
#     precipitation: "normal"
#   var_settings:
#     precipitation:
#       use_log: true
#
# precipitation has "positive" support in the catalog, so use_log is valid.
# The log pre-transform maps (0, ∞) → ℝ, after which a normal distribution is appropriate.
var_settings: {}

coord_vars:
  - swiss_easting
  - swiss_northing

geo_vars:
  - swiss_easting
  - swiss_northing
  - dem

# Stations (null = all available stations)
stations: null

# Time range (null = full available range)
start_date: null
end_date: null

# Topographic patch settings
patch_size:
  - 32
  - 32

# Time embedding
use_time_embedding: true

# Cache settings
cache_dir: "/scratch/mch/cdonner/data/obs_downscaling/raw/cosmo-1e_rechunked/cache_constant_inputs"
clear_cache: false

dtype: float32

data_points_for_stats: 4096
