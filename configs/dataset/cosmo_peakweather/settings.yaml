defaults:
  - base@_here_
  - catalog@catalog
  - _self_

dataset_type: cosmo_peakweather

coord_sources:
  stations: {from: obs}
  nwp_grid: {from: nwp}

fields:
  obs:  {coords: stations, inputs: [obs.temperature]}
  nwp:  {coords: stations, inputs: [nwp.T_2M], query: true}
  topo: {coords: stations, inputs: [topo.DEM, topo.TPI_500M, topo.TPI_2000M,
                                    topo.WE_DERIVATIVE_2000M_SIGRATIO1,
                                    topo.SN_DERIVATIVE_2000M_SIGRATIO1], query: true}
  geo:  {coords: stations, inputs: [coords.x, coords.y, topo.DEM],
         out: [swiss_easting, swiss_northing, dem], query: true, interp: linear}

roles:
  target: obs
  global: nwp
  geo_bias: geo
  topo: topo
