defaults:
  - cosmo_peakweather/settings@_here_
  - _self_

nwp_vars: [T_2M, T_G]

obs_vars: [temperature]

obs_variable_to_distribution:
  temperature: normal

# All stations incl. rain gauges (matches old temp.yaml; overrides settings'
# meteo_station default).
station_type: null

fields:
  obs: {coords: stations, inputs: [obs.temperature]}
  nwp: {coords: stations, inputs: [nwp.T_2M, nwp.T_G], query: true}
  # The grid field carries all nwp_vars, matching the OOTG model's
  # dim_gridded_y and the scalar-vs-field validation.
  nwp_grid_field: {coords: nwp_grid, inputs: [nwp.T_2M, nwp.T_G]}
