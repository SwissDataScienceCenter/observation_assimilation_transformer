defaults:
  - dataset: cosmo_peakweather/temp_ootg
  - split: default
  - dataloader: default
  - trainer: default
  - logging: default
  - _self_

seed: 42

# Data
run_name: null             # override the auto-generated checkpoint/W&B run name
nwp_stride: null           # grid coarsening; null -> 10 for COSMO, 4 for ERA5

# Architecture
use_topo: true            # field path does not feed high-res topo patches yet

model:
  transform_type: keep_support   # matches OAT; disables log-transform

# Training
lr: 5e-4
n_samples: 20             # MC samples for CRPS loss and metrics (must be >= 2)
ablate_obs: false
ablate_grid: false

# The OOTG batch unwrap expects B == 1: the context length varies after mask
# filtering, so batches cannot be stacked. Keep batch size 1 everywhere.
dataloader:
  train: {batch_size: 1}
  validation: {batch_size: 1}
  test: {batch_size: 1}

# Epoch length and validation cadence mirror the legacy generator's
# samples_per_epoch=10000 / val_samples_per_epoch=1000 / check_val_every_n_epoch=2.
trainer:
  max_epochs: 300
  gradient_clip_val: 0.5
  check_val_every_n_epoch: 2
  limit_train_batches: 10000
  limit_val_batches: 1000

paths:
  data_root: ${oc.env:OAT_DATA_ROOT,data}
  checkpoint_root: ${oc.env:OAT_CKPT_ROOT,checkpoints}
