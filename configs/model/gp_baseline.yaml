defaults:
  - topographic_encoder: default

model_cls: oat.model_module.gp_baseline.GPBaseline

use_nwp: true
use_time_emb: true
use_topography: true

mean_hidden_dims: [32]
kernel_hidden_dims: [32]
kernel_embed_dim: 4
mean_groups: [nwp, time_emb, topo]
cov_groups: [nwp, geo,]

noise_variance: 1.0
loss_fn: crps
num_samples: 100
