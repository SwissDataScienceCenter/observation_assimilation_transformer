# d_model: defined at model level
nhead: 4
num_encoder_layers: 3
num_decoder_layers: 3
# dim_feedforward: derived from 2 * d_model at runtime
dropout: 0.1
activation: GELU
sparse_attn: true
decoder_self_attention: false
# d_geo_bias: int = 3   # data dependent
dim_geo_bias_feedforward: 32
activation_geo_bias: GELU