defaults:
  - dataset: cosmo_peakweather/temp
  - split: no_conditioning # uses 0% of the stations as "key-values"
  - dataloader: default
  - model: uninformed_oat
  - trainer: default
  - predictor: oat_predictor
  - logging: default
  - profiler: no_profiler

seed: 42

resume_from_checkpoint: null  # path to a checkpoint to resume training from (e.g. last.ckpt)

hydra:
  run:
    dir: outputs/${hydra:runtime.choices.model}/${now:%Y-%m-%d}/${now:%H-%M-%S}


logging:
  run_name_prefix: uninf_oat_training

paths:
  run_root: ${hydra:run.dir}
  # Data and checkpoint roots. Set OAT_DATA_ROOT and OAT_CKPT_ROOT, or use
  # ./data and ./checkpoints below the working directory (the repository root).
  data_root: ${oc.env:OAT_DATA_ROOT,data}
  checkpoint_root: ${oc.env:OAT_CKPT_ROOT,checkpoints}
