[tool.poetry]
name = "oat"
version = "0.1.0"
description = ""
authors = ["Christian Donner <christian.donner@meteoswiss.ch>", "Michele Cattaneo <michele.cattaneo@meteoswiss.ch>"]
packages = [{include = "oat", from = "src"},
            {include = "oat_test", from = "test"}]
include = ["test/oat_test/**/*.py"]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
torch =  ">=2.4.0,<2.5.0"  # 2.4 works with glibc 2.31
pytorch-lightning = ">=2.4.0,<3.0.0"  # Version range aligned with torch 2.4.x
anemoi-datasets = ">=0.5.28,<0.6.0"
gcsfs = ">=2025.10.0,<2026.0.0"
earthkit-data = ">=0.18.3,<0.19.0"
matplotlib = ">=3.10.7,<4.0.0"
cartopy = ">=0.25.0,<0.26.0"
ipykernel = "*"
ipywidgets = ">=8.1.8,<9.0.0"
tensorboardx = ">=2.6.4,<3.0.0"
hydra-core = "^1.3.2"
scikit-learn = "^1.8.0"
monai = "^1.5.1"
einops = "^0.8.1"
torch-cluster = {version = "1.6.3", source = "torch-wheels"}
peakweather = {git = "https://github.com/MeteoSwiss/PeakWeather.git"}

[tool.poetry.group.dev.dependencies]
black = ">=24.0"
ruff = ">=0.4.0"
mypy = ">=1.8.0"
line-profiler = ">=5.0.0,<6.0.0"
pylance = "*"
pytest = "*"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = []
line-length = 88
target-version = "py312"

[tool.ruff.isort]
known-first-party = ["oat"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
show_error_codes = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.poetry.source]]
name = "torch-wheels"
url = "https://data.pyg.org/whl/torch-2.4.0+cu121.html"
priority = "supplemental"
