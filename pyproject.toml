[tool.poetry]
name = "oat"
version = "1.0.0"
description = "Observation Assimilation Transformer: probabilistic weather analysis from sparse station observations"
authors = [
    "Christian Donner",
    "Michele Cattaneo",
    "Maxim Samarin",
    "Francesco Zanetta",
    "Icíar Lloréns Jover",
    "Gabriela Aznar Siguan",
    "Michele Volpi",
]
license = "MIT"
packages = [{include = "oat", from = "src"},
            {include = "oat_test", from = "test"},
            {include = "scripts"}]
include = ["test/oat_test/**/*.py"]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
torch =  ">=2.4.0,<2.5.0"  # 2.4 works with glibc 2.31
pytorch-lightning = ">=2.4.0,<3.0.0"  # Version range aligned with torch 2.4.x
anemoi-datasets = ">=0.5.28,<0.6.0"
earthkit-data = ">=0.18.3,<0.19.0"  # version pin for a transitive dependency (anemoi-transform)
matplotlib = ">=3.10.7,<4.0.0"
cartopy = ">=0.25.0,<0.26.0"
hydra-core = "^1.3.2"
scikit-learn = "^1.8.0"  # version pin for a transitive dependency (gpytorch)
einops = "^0.8.1"
torch-cluster = {version = "1.6.3", source = "torch-wheels"}
torch-scatter = {version = "2.1.2", source = "torch-wheels"}
torch-sparse = {version = "0.6.18", source = "torch-wheels"}
pyg-lib = {version = "0.4.0", source = "torch-wheels"}
torch-geometric = ">=2.7.0"
peakweather = {git = "https://github.com/MeteoSwiss/PeakWeather.git", tag = "v0.2.0"}
wandb = "*"
obsweatherscale = {git = "https://github.com/MeteoSwiss/obsweatherscale.git", rev = "852c19e", python = ">=3.10,<3.13"}
gpytorch = ">=1.13,<2.0"
pyarrow = ">=23.0.0,<24.0.0"  # parquet engine for pandas (Meteostat observations)
numpy = ">=1.26.4"
pandas = ">=3.0.0"
scipy = ">=1.17.0"
xarray = ">=2024.11.0"
zarr = ">=2.18.7"
pyproj = ">=3.7.2"
shapely = ">=2.1.2"
omegaconf = ">=2.3.0"
pyyaml = ">=6.0.3"
check-shapes = ">=1.1.1,<2.0.0"  # imported by deps/gridded-tnp (OOTG baseline)
hiyapyco = ">=0.7.0,<0.8.0"  # imported by deps/gridded-tnp (OOTG baseline)
lightning = ">=2.4.0,<3.0.0"  # imported by deps/gridded-tnp (OOTG baseline)
linear-operator = ">=0.6.1,<0.7.0"  # imported by oat.model_module.gp_baseline

[tool.poetry.group.dev.dependencies]
black = ">=24.0"
ruff = ">=0.4.0"
mypy = ">=1.8.0"
pytest = "*"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = []
line-length = 88
target-version = "py312"

[tool.ruff.isort]
known-first-party = ["oat"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
show_error_codes = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.poetry.source]]
name = "torch-wheels"
url = "https://data.pyg.org/whl/torch-2.4.0+cu121.html"
priority = "supplemental"
