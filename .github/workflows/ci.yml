name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Leak check
        # Standard library only, so it runs before the long install.
        run: python3 -m release.leak_check

      - name: Free disk space
        run: |
          # The dependency set is large (torch, torch-geometric, cartopy).
          # Remove preinstalled toolchains not used by this project to avoid
          # "No space left on device" during poetry install.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies (with dev)
        run: |
          poetry install --with dev

      - name: Run tests
        # The tests that need the real datasets skip, because CI has no data.
        run: |
          poetry run pytest --cov=oat --cov-report=term